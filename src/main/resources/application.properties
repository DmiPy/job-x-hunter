spring.application.name=job-x-hunter

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobxhunterdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/jobxhunter}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/jobxhunter/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=${KEYCLOAK_AUDIENCE:jobxhunter-api}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
ingestion.schedule.enabled=${INGESTION_SCHEDULE_ENABLED:false}
ingestion.schedule.interval-ms=${INGESTION_INTERVAL_MS:3600000}
ingestion.adzuna.enabled=${ADZUNA_ENABLED:false}
ingestion.adzuna.app-id=${ADZUNA_APP_ID:}
ingestion.adzuna.app-key=${ADZUNA_APP_KEY:}
ingestion.adzuna.keywords=${ADZUNA_KEYWORDS:}
ingestion.adzuna.locations=${ADZUNA_LOCATIONS:}
ingestion.adzuna.categories=${ADZUNA_CATEGORIES:}
ingestion.adzuna.page-size=${ADZUNA_PAGE_SIZE:20}
ingestion.adzuna.max-pages=${ADZUNA_MAX_PAGES:3}
ingestion.adzuna.daily-budget=${ADZUNA_DAILY_BUDGET:100}
ingestion.adzuna.run-budget=${ADZUNA_RUN_BUDGET:30}
ingestion.adzuna.retries=${ADZUNA_RETRIES:2}
ingestion.adzuna.pacing-ms=${ADZUNA_PACING_MS:1000}
ingestion.adzuna.connect-timeout-ms=${ADZUNA_CONNECT_TIMEOUT_MS:5000}
ingestion.adzuna.read-timeout-ms=${ADZUNA_READ_TIMEOUT_MS:10000}
ingestion.adzuna.backoff-ms=${ADZUNA_BACKOFF_MS:1000}
