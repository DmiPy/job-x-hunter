# Production must receive all schema migrations but never local seed data.
spring.jpa.show-sql=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-prod.yaml
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
