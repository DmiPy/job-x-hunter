services:

  db:
    image: postgres:17
    container_name: jobxhunter-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  app:
    build: .

    container_name: jobxhunter-app

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "${APP_PORT}:8080"

    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8180/realms/jobxhunter}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/jobxhunter/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-jobxhunter-api}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      INGESTION_SCHEDULE_ENABLED: ${INGESTION_SCHEDULE_ENABLED:-false}
      INGESTION_INTERVAL_MS: ${INGESTION_INTERVAL_MS:-3600000}
      ADZUNA_ENABLED: ${ADZUNA_ENABLED:-false}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_KEYWORDS: ${ADZUNA_KEYWORDS:-}
      ADZUNA_LOCATIONS: ${ADZUNA_LOCATIONS:-}
      ADZUNA_CATEGORIES: ${ADZUNA_CATEGORIES:-}
      ADZUNA_PAGE_SIZE: ${ADZUNA_PAGE_SIZE:-20}
      ADZUNA_MAX_PAGES: ${ADZUNA_MAX_PAGES:-3}
      ADZUNA_DAILY_BUDGET: ${ADZUNA_DAILY_BUDGET:-100}
      ADZUNA_RUN_BUDGET: ${ADZUNA_RUN_BUDGET:-30}
      ADZUNA_RETRIES: ${ADZUNA_RETRIES:-2}
      ADZUNA_PACING_MS: ${ADZUNA_PACING_MS:-1000}
      ADZUNA_CONNECT_TIMEOUT_MS: ${ADZUNA_CONNECT_TIMEOUT_MS:-5000}
      ADZUNA_READ_TIMEOUT_MS: ${ADZUNA_READ_TIMEOUT_MS:-10000}
      ADZUNA_BACKOFF_MS: ${ADZUNA_BACKOFF_MS:-1000}

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: jobxhunter-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak/realm-jobxhunter.json:/opt/keycloak/data/import/jobxhunter-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /realms/jobxhunter/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && read -r line <&3 && [[ \"$$line\" == *\" 200 \"* ]]' "]
      interval: 15s
      timeout: 5s
      retries: 20


volumes:
  postgres_data:
